<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fdfbf7" stroke="#b91c1c" stroke-width="4"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#991b1b">গণপ্রজাতন্ত্রী বাংলাদেশ সরকার - রেজিস্ট্রি দলিল [জালিয়াতি সিমুলেশন]</text>
  <text x="400" y="105" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#374151">সাব-রেজিস্ট্রার কার্যালয়, সাভার, ঢাকা | এলাকা পরিবর্তন টেস্ট</text>
  <line x1="50" y1="125" x2="750" y2="125" stroke="#cbd5e1" stroke-width="2"/>
  
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">দলিল নম্বর (Deed No):</text>
  <text x="320" y="170" font-family="Courier, monospace" font-size="18" fill="#1e40af">LP-2026-001</text>
  
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">খতিয়ান নম্বর (Khatian):</text>
  <text x="320" y="215" font-family="Courier, monospace" font-size="18" fill="#111827">KH-2026-0001 (আরএস)</text>
  
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">দাগ নম্বর (Dag No):</text>
  <text x="320" y="260" font-family="Courier, monospace" font-size="18" fill="#111827">DAG-2026-001</text>
  
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">মৌজা (Mouza):</text>
  <text x="320" y="305" font-family="Arial, sans-serif" font-size="18" fill="#111827">হেমায়েতপুর (জেএল ১০১)</text>
  
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c">জমির পরিমাণ (Altered Area):</text>
  <text x="320" y="350" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#b91c1c">২৫.০০ শতক (25.00 Shotok) [TAMPERED: আসল ১৫.০০ শতক]</text>
  
  <text x="60" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">জমির শ্রেণি (Land Type):</text>
  <text x="320" y="395" font-family="Arial, sans-serif" font-size="18" fill="#111827">আবাসিক (Residential)</text>
  
  <text x="60" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">মালিক/দাতা (Seller):</text>
  <text x="320" y="440" font-family="Arial, sans-serif" font-size="18" fill="#111827">মোহাম্মদ আব্দুল করিম</text>
  
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">গ্রহীতা (Buyer):</text>
  <text x="320" y="485" font-family="Arial, sans-serif" font-size="18" fill="#111827">তানভীর আহমেদ</text>

  <rect x="50" y="520" width="700" height="50" fill="#fef2f2" stroke="#ef4444" rx="4"/>
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#991b1b">সিমুলেশন: জমির পরিমাণ কাগজপত্রে জালিয়াতি করে ১৫ থেকে ২৫ শতক করা হয়েছে</text>
</svg>

